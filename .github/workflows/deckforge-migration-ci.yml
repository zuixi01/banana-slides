name: Deckforge Migration CI

on:
  pull_request:
  push:
    branches: [main, migration/deckforge-core]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deckforge-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: uv sync --extra test --frozen
      - name: Backend tests
        run: uv run pytest backend/tests -q
        env:
          TESTING: 'true'
          USE_MOCK_AI: 'true'
          GOOGLE_API_KEY: mock-api-key-for-testing
      - name: Frontend dependencies
        run: cd frontend && npm ci
      - name: Frontend tests
        run: cd frontend && npm test -- --run
      - name: Frontend production build
        run: cd frontend && npm run build

  mocked-e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create non-secret mock configuration
        run: |
          cp .env.deckforge.example .env
          printf '\nTESTING=true\nUSE_MOCK_AI=true\nGOOGLE_API_KEY=mock-api-key-for-testing\n' >> .env
      - name: Build and start local CI containers
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          chmod +x scripts/wait-for-health.sh
          ./scripts/wait-for-health.sh http://localhost:5011/ready 90 2
          ./scripts/wait-for-health.sh http://localhost:3011 90 2
      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run critical mocked workflow
        run: cd frontend && npx playwright test ui-full-flow-mocked.spec.ts --workers=1
        env:
          CI: 'true'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop local CI containers
        if: always()
        run: docker compose down

  image:
    needs: [test, mocked-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/banana-slides:sha-${{ github.sha }}
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            APP_COMMIT_SHORT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable digest
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/banana-slides:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
